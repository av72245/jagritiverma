# Pages CMS (https://pagescms.org): a simple editor for this site.
# Sign in at app.pagescms.org with GitHub, open this repository, and edit with forms.
# Every save is a commit, and Netlify rebuilds the site about a minute later.

media:
  - name: photos
    label: Photos (Moments mosaic)
    input: media/photos
    output: /media/photos
    categories: [image]
  - name: reels
    label: Reels (videos)
    input: media/reels
    output: /media/reels
    categories: [video, image, document]
  - name: hats
    label: Banker / Broker / Founder photos
    input: media/hats
    output: /media/hats
    categories: [image]
  - name: portrait
    label: Portrait (hero circle)
    input: media/portrait
    output: /media/portrait
    categories: [image]

content:
  - name: gyan
    label: Free ka gyan
    type: collection
    path: src/content/gyan
    filename: "{fields.question}.md"
    view:
      fields: [question, tag, updated]
      primary: question
      sort: order
      order: asc
    fields:
      - name: question
        label: Question
        description: The question as people would ask it. Also used for the page address of new tips.
        type: string
        required: true
      - name: tag
        label: Tag
        description: One or two words shown on the card, e.g. Rates, Deposit.
        type: string
        required: true
      - name: short
        label: Short answer
        description: Two sentences. Shown on the flip card on the home page and at the top of the tip page.
        type: text
        required: true
      - name: description
        label: Google description
        description: About 150 characters. Shown under the title in Google results.
        type: text
        required: true
      - name: order
        label: Order
        description: Lower numbers show first.
        type: number
        default: 99
      - name: updated
        label: Last reviewed
        type: date
        required: true
      - name: body
        label: Full answer
        description: Use headings to split it into sections. They become the "On this page" links.
        type: rich-text

  - name: work
    label: Work with me page
    type: file
    path: src/data/work.json
    format: json
    fields:
      - name: headline
        label: Headline
        type: string
      - name: intro
        label: Intro
        type: text
      - name: email
        label: Contact email
        description: Shown next to the contact form. Leave empty to hide.
        type: string
      - name: stats
        label: Numbers
        type: object
        list: true
        fields:
          - { name: value, label: Number, type: string }
          - { name: label, label: Label, type: string }
      - name: audience
        label: Audience
        type: text
      - name: formats
        label: Collaboration formats (flip cards)
        type: object
        list: true
        fields:
          - { name: name, label: Format name, type: string }
          - name: colour
            label: Card colour
            type: select
            options:
              values: [rose, sea, gold, royal]
          - { name: front, label: Front of card, type: text }
          - { name: backTitle, label: Back title, type: string }
          - { name: back, label: Back of card, type: text }
      - name: brands
        label: Brands she has created for
        type: string
        list: true
      - name: brandSlots
        label: Empty "Brand name" slots to show
        type: number
      - name: process
        label: How it works (steps)
        type: object
        list: true
        fields:
          - { name: title, label: Step, type: string }
          - { name: text, label: Description, type: text }
      - name: faqs
        label: FAQs for brands
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
